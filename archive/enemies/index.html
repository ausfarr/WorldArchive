<link rel="stylesheet" href="../css/style.css">
<style>
  /* Import/Reflavor/Homebrew source picker (5e only) -- promoted to a
     visible button row (finding #6) instead of the original <select>,
     so "Import" (free, not an AI call) reads as its own first-class
     option at a glance rather than a hidden sub-choice of "Generate". */
  .mode-btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    background: var(--bg-panel-raised); border: 1px solid var(--border-line);
    color: var(--ink-dim); padding: 8px 14px; cursor: pointer;
    font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; font-size: 0.82rem;
  }
  .mode-btn-tag {
    font-family: var(--font-mono); text-transform: none; letter-spacing: 0; font-size: 0.65rem; color: var(--ink-faint);
  }
  .mode-btn-import { border-color: var(--neon-cyan); }
  .mode-btn-import .mode-btn-tag { color: var(--neon-cyan); }
  .mode-btn-active {
    border-color: var(--neon-primary); color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--neon-primary);
  }
</style>
<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_theme_cache');
    if (!cached) return;
    var t = JSON.parse(cached);
    var hex = /^#[0-9a-fA-F]{6}$/;
    var overrides = [];
    if (hex.test(t.backgroundColor)) overrides.push('--bg-void: ' + t.backgroundColor + ';');
    if (hex.test(t.panelColor)) overrides.push('--bg-panel: ' + t.panelColor + '; --bg-panel-raised: ' + t.panelColor + ';');
    if (hex.test(t.inkColor)) overrides.push('--ink: ' + t.inkColor + ';');
    if (hex.test(t.primaryColor)) overrides.push('--neon-primary: ' + t.primaryColor + ';');
    if (hex.test(t.secondaryColor)) overrides.push('--neon-cyan: ' + t.secondaryColor + ';');
    if (t.fontDisplay) {
      overrides.push("--font-display: '" + t.fontDisplay + "', sans-serif;");
      var l1 = document.createElement('link');
      l1.rel = 'stylesheet';
      l1.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.fontDisplay).replace(/%20/g, '+') + ':wght@400;600;700&display=swap';
      document.head.appendChild(l1);
    }
    if (t.fontBody) {
      overrides.push("--font-body: '" + t.fontBody + "', sans-serif;");
      var l2 = document.createElement('link');
      l2.rel = 'stylesheet';
      l2.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.fontBody).replace(/%20/g, '+') + ':wght@400;500;600&display=swap';
      document.head.appendChild(l2);
    }
    var styleTag = document.createElement('style');
    styleTag.id = 'world-theme-cached';
    styleTag.textContent = ':root { ' + overrides.join(' ') + ' }';
    document.head.appendChild(styleTag);
  } catch (e) { /* no cache yet, or malformed -- fall back to default theme, async apply will fix it */ }
})();
</script>

</head>

      </select>

<script>
// ============================================================
// Multi-ruleset genericization, Phase 11. The generate form above is
// Echoes' own shape (Name/Tier/Faction) and stays exactly that for an
// Echoes world or if the ruleset lookup fails (fail open to the
// long-established default rather than a broken/blank form). A 5e
// world gets its own field set + submit handler, built once the
// world's ruleset is known -- see initEnemyGenerateForm() below.
// ============================================================

function wireEchoesEnemyForm() {
  document.getElementById('gen-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('gen-submit');
    const status = document.getElementById('gen-status');
    btn.disabled = true; btn.textContent = 'Generating…';
    showGenerationOverlay(['Rolling up a threat…', 'Balancing the stat block…', 'Sketching claws and teeth…','Picking a fighting style…','Naming its favorite move…','Almost there…']);
    status.style.display = 'block'; status.textContent = 'Calling the generator — this can take a bit for content + art…';
    try {
      const res = await authFetch('/api/generate-enemy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('gen-name').value,
          tier: document.getElementById('gen-field-2').value,
          faction: document.getElementById('gen-field-3').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(formatGenerationError(data));
      status.textContent = `Generated: ${data.name} (${data.tier} — ${data.faction})${data.attributeBudgetWarning ? ' — note: ' + data.attributeBudgetWarning : ''}` + (data.imageError ? ` — portrait failed: ${data.imageError}` : '');
      setTimeout(() => window.location.reload(), data.imageError ? 6000 : 1200);
    } catch (err) {
      status.innerHTML = err.message;
    } finally {
      hideGenerationOverlay();
      btn.disabled = false; btn.textContent = 'Generate';
    }
  });
  populateFactionSelect('gen-field-3', { includeUnaligned: true });
}

// Real backend contract, tested at the function level in
// scripts/test5eStatFormulas.js and by hand in this session -- see
// routes/generateEnemy.js's 5e branch for the mode/srdLibraryId/targetCr
// request shape this submits.
async function wire5eEnemyForm() {
  const fieldsHost = document.getElementById('gen-form-fields');
  fieldsHost.innerHTML = `
    <div style="flex: 1; min-width: 160px;">
      <label for="gen-name" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">NAME (optional)</label>
      <input id="gen-name" type="text" placeholder="leave blank to generate" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px; font-family: var(--font-body);">
    </div>
    <div style="flex-basis: 100%; min-width: 260px;">
      <label style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 6px;">SOURCE</label>
      <div id="gen-mode-buttons" style="display:flex; gap:8px; flex-wrap:wrap;">
        <button type="button" class="mode-btn mode-btn-import" data-mode="import">Import<span class="mode-btn-tag">free · official SRD content</span></button>
        <button type="button" class="mode-btn" data-mode="reflavor">Reflavor<span class="mode-btn-tag">AI · SRD stats, new narrative</span></button>
        <button type="button" class="mode-btn" data-mode="homebrew">Homebrew AI<span class="mode-btn-tag">AI · fully new design</span></button>
      </div>
      <input type="hidden" id="gen-mode" value="import">
    </div>
    <div id="gen-srd-picker-wrap" style="flex: 1; min-width: 200px; display: none;">
      <label for="gen-srd-picker" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">SRD MONSTER</label>
      <select id="gen-srd-picker" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;"></select>
    </div>
    <div id="gen-cr-wrap" style="flex: 1; min-width: 120px;">
      <label for="gen-target-cr" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">TARGET CR (optional)</label>
      <input id="gen-target-cr" type="text" placeholder="e.g. 1/2, 3" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px; font-family: var(--font-body);">
    </div>
    <div style="flex: 1; min-width: 160px;">
      <label for="gen-field-3" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">FACTION</label>
      <select id="gen-field-3" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;">
        <option value="">Let it choose</option>
      </select>
    </div>
  `;
  populateFactionSelect('gen-field-3', { includeUnaligned: true });

  let srdMonsters = [];
  try {
    const res = await authFetch('/api/srd-library?ruleset=5e&category=monsters');
    const data = await res.json();
    srdMonsters = data.entries || [];
  } catch (err) {
    console.error('Could not load SRD monster list:', err);
  }
  const srdSelect = document.getElementById('gen-srd-picker');
  srdSelect.innerHTML = srdMonsters
    .map((m) => `<option value="${m.id}">${m.name}${m.cr != null ? ` (CR ${m.cr})` : ''}</option>`)
    .join('') || '<option value="">No SRD monsters available</option>';

  const modeSubmitLabels = { import: 'Import', reflavor: 'Generate', homebrew: 'Generate' };

  function updateModeVisibility() {
    const mode = document.getElementById('gen-mode').value;
    document.getElementById('gen-srd-picker-wrap').style.display = (mode === 'import' || mode === 'reflavor') ? 'block' : 'none';
    document.getElementById('gen-cr-wrap').style.display = mode === 'homebrew' ? 'block' : 'none';
    document.querySelectorAll('#gen-mode-buttons .mode-btn').forEach((b) => {
      b.classList.toggle('mode-btn-active', b.dataset.mode === mode);
    });
    document.getElementById('gen-submit').textContent = modeSubmitLabels[mode] || 'Generate';
  }
  document.querySelectorAll('#gen-mode-buttons .mode-btn').forEach((b) => {
    b.addEventListener('click', () => {
      document.getElementById('gen-mode').value = b.dataset.mode;
      updateModeVisibility();
    });
  });
  updateModeVisibility();
  promoteImportToStage1();

  document.getElementById('gen-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('gen-submit');
    const status = document.getElementById('gen-status');
    const mode = document.getElementById('gen-mode').value;
    btn.disabled = true; btn.textContent = mode === 'import' ? 'Importing…' : 'Generating…';
    showGenerationOverlay(mode === 'import' ? ['Copying the SRD stat block…'] : ['Rolling up a threat…', 'Computing Challenge Rating…', 'Balancing the stat block…', 'Almost there…']);
    status.style.display = 'block'; status.textContent = 'Calling the generator…';
    try {
      const body = {
        name: document.getElementById('gen-name').value,
        faction: document.getElementById('gen-field-3').value,
        mode
      };
      if (mode === 'import' || mode === 'reflavor') body.srdLibraryId = document.getElementById('gen-srd-picker').value;
      if (mode === 'homebrew' && document.getElementById('gen-target-cr').value) body.targetCr = document.getElementById('gen-target-cr').value;

      const res = await authFetch('/api/generate-enemy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(formatGenerationError(data));
      status.textContent = `Generated: ${data.name}${data.summary ? ' — ' + data.summary : ''}`;
      setTimeout(() => window.location.reload(), 1200);
    } catch (err) {
      status.innerHTML = err.message;
    } finally {
      hideGenerationOverlay();
      btn.disabled = false; btn.textContent = modeSubmitLabels[mode] || 'Generate';
    }
  });
}

// wireCreateEntryCollapse() (js/render.js, shared by all 8 category
// pages) already wraps this whole panel in a "+ Create Entry" -> Stage
// 1 ("Generate with AI" / "Enter Manually" / "Roll Randomly") -> Stage 2
// (reveals #gen-form-fields) accordion. Without this, Import -- a free
// action, not an AI generation -- would still be reachable only by
// clicking a button literally labeled "Generate with AI" first (finding
// #6): the SOURCE row above gets it out of a hidden <select>, but not
// out from behind that misleading label. Polls for Stage 1's row rather
// than hooking into wireCreateEntryCollapse() directly -- that function
// runs from a separate init() chain (requireAuth().then(...)) with no
// ordering guarantee relative to this DOMContentLoaded-triggered flow,
// and it's shared by every category page, so this stays a page-local
// addition instead of a shared-code change.
function whenReady(selector, cb, tries) {
  tries = tries == null ? 40 : tries;
  const el = document.querySelector(selector);
  if (el) return cb(el);
  if (tries <= 0) return;
  requestAnimationFrame(() => whenReady(selector, cb, tries - 1));
}

function promoteImportToStage1() {
  whenReady('#create-entry-stage1-row', (stage1Row) => {
    if (document.getElementById('create-entry-import-btn')) return; // already injected
    const aiBtn = document.getElementById('create-entry-ai-btn');

    const importBtn = document.createElement('button');
    importBtn.type = 'button';
    importBtn.id = 'create-entry-import-btn';
    importBtn.textContent = 'Import (free)';
    importBtn.title = 'Copy an official 5e SRD monster straight in -- zero AI cost.';
    importBtn.style.cssText = "background: var(--bg-panel-raised); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); padding: 10px 20px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; font-weight: 600;";
    importBtn.addEventListener('click', () => {
      // Mirrors wireCreateEntryCollapse()'s own showStage2() reveal
      // (stage1Row hidden, fields/submit/eyebrow shown) rather than
      // calling it directly -- it's a closure-local function, not
      // exposed globally.
      stage1Row.style.display = 'none';
      const eyebrow = document.querySelector('.sheet-eyebrow');
      const fieldsWrap = document.getElementById('gen-form-fields');
      const submitBtn = document.getElementById('gen-submit');
      if (eyebrow) eyebrow.style.display = '';
      if (fieldsWrap) fieldsWrap.style.display = '';
      if (submitBtn) submitBtn.style.display = '';
      whenReady('.mode-btn[data-mode="import"]', (btn) => btn.click());
    });
    stage1Row.insertBefore(importBtn, aiBtn || stage1Row.firstChild);

    // "Generate with AI" now sits next to its own dedicated free
    // alternative -- default it into an actual AI tier (Homebrew)
    // instead of silently landing on Import, which would make the two
    // Stage 1 buttons functionally overlap.
    if (aiBtn) {
      aiBtn.addEventListener('click', () => {
        whenReady('.mode-btn[data-mode="homebrew"]', (btn) => btn.click());
      });
    }
  });
}

// Real backend contract: routes/generateEnemy.js's handleGenericEnemyGenerate
// takes {name, faction} only -- attributes/derived stats are entirely
// model-proposed against this world's own generic_system_json (Phase
// 10), nothing ruleset-specific to expose as a form field here. A world
// that hasn't configured generic_system_json yet gets a clear 400 from
// the API (surfaced via formatGenerationError), not a broken form.
function wireGenericEnemyForm() {
  const fieldsHost = document.getElementById('gen-form-fields');
  fieldsHost.innerHTML = `
    <div style="flex: 1; min-width: 220px;">
      <label for="gen-name" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">NAME (optional)</label>
      <input id="gen-name" type="text" placeholder="leave blank to generate" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px; font-family: var(--font-body);">
    </div>
    <div style="flex: 1; min-width: 160px;">
      <label for="gen-field-2" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">FACTION</label>
      <select id="gen-field-2" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;">
        <option value="">Let it choose</option>
      </select>
    </div>
  `;
  populateFactionSelect('gen-field-2', { includeUnaligned: true });

  document.getElementById('gen-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('gen-submit');
    const status = document.getElementById('gen-status');
    btn.disabled = true; btn.textContent = 'Generating…';
    showGenerationOverlay(['Designing your world\'s creature…', 'Working out its attributes…', 'Almost there…']);
    status.style.display = 'block'; status.textContent = 'Calling the generator…';
    try {
      const res = await authFetch('/api/generate-enemy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('gen-name').value,
          faction: document.getElementById('gen-field-2').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(formatGenerationError(data));
      status.textContent = `Generated: ${data.name}${data.summary ? ' — ' + data.summary : ''}`;
      setTimeout(() => window.location.reload(), 1200);
    } catch (err) {
      status.innerHTML = err.message;
    } finally {
      hideGenerationOverlay();
      btn.disabled = false; btn.textContent = 'Generate';
    }
  });
}

async function initEnemyGenerateForm() {
  let ruleset = 'echoes';
  try {
    const res = await authFetch('/api/wizard/ruleset-options');
    const data = await res.json();
    ruleset = data.current || 'echoes';
  } catch (err) {
    console.error('Could not load this world\'s ruleset, defaulting to Echoes form:', err);
  }
  if (ruleset === '5e') {
    await wire5eEnemyForm();
  } else if (ruleset === 'generic') {
    wireGenericEnemyForm();
  } else {
    wireEchoesEnemyForm();
  }
}
document.addEventListener('DOMContentLoaded', initEnemyGenerateForm);
</script>

<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_category_config_cache');
    if (!cached) return;
    var categoryConfig = JSON.parse(cached);
    var site = categoryConfig._site || {};
    if (site.title) {
      var titleEl = document.getElementById('site-title-text');
      if (titleEl) titleEl.textContent = site.title;
      document.title = document.title.indexOf(' \u2014 ') !== -1
        ? document.title.replace(/ \u2014 .+$/, ' \u2014 ' + site.title)
        : site.title;
    }
    if (site.tagline) {
      var taglineEl = document.getElementById('hero-tagline');
      if (taglineEl) taglineEl.textContent = site.tagline;
    }
    if (site.footer) {
      var footerEl = document.getElementById('site-footer-text');
      if (footerEl) footerEl.textContent = site.footer;
    }
    Object.keys(categoryConfig).forEach(function(key) {
      if (key === '_site') return;
      var cfg = categoryConfig[key];
      var navLink = document.getElementById('nav-' + key);
      if (navLink) {
        if (cfg.enabled === false) navLink.style.display = 'none';
        else if (cfg.label) navLink.textContent = cfg.label;
      }
      var card = document.getElementById('card-' + key);
      if (card) {
        if (cfg.enabled === false) {
          card.style.display = 'none';
        } else if (cfg.label) {
          var h2 = card.querySelector('h2');
          if (h2) h2.textContent = cfg.label;
        }
      }
      if (cfg.blurb) {
        var cardDesc = document.getElementById('card-desc-' + key);
        if (cardDesc) cardDesc.textContent = cfg.blurb;
      }
      if (document.body.dataset.category === key) {
        if (cfg.label) {
          var pageTitle = document.getElementById('page-title');
          var crumbLabel = document.getElementById('crumb-label');
          if (pageTitle) pageTitle.textContent = cfg.label;
          if (crumbLabel) crumbLabel.textContent = cfg.label;
          document.title = document.title.replace(/^[^\u2014]+/, cfg.label + ' ');
        }
        if (cfg.blurb) {
          var pageBlurb = document.getElementById('page-blurb');
          if (pageBlurb) pageBlurb.textContent = cfg.blurb;
        }
      }
    });
  } catch (e) { /* no cache yet, or malformed -- async apply will fix it */ }
})();
</script>
