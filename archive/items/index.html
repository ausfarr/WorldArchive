<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_theme_cache');
    if (!cached) return;
    var t = JSON.parse(cached);
    var hex = /^#[0-9a-fA-F]{6}$/;
    var overrides = [];
    if (hex.test(t.backgroundColor)) overrides.push('--bg-void: ' + t.backgroundColor + ';');
    if (hex.test(t.panelColor)) overrides.push('--bg-panel: ' + t.panelColor + '; --bg-panel-raised: ' + t.panelColor + ';');
    if (hex.test(t.inkColor)) overrides.push('--ink: ' + t.inkColor + ';');
    if (hex.test(t.primaryColor)) overrides.push('--neon-primary: ' + t.primaryColor + ';');
    if (hex.test(t.secondaryColor)) overrides.push('--neon-cyan: ' + t.secondaryColor + ';');
    if (t.fontDisplay) {
      overrides.push("--font-display: '" + t.fontDisplay + "', sans-serif;");
      var l1 = document.createElement('link');
      l1.rel = 'stylesheet';
      l1.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.fontDisplay).replace(/%20/g, '+') + ':wght@400;600;700&display=swap';
      document.head.appendChild(l1);
    }
    if (t.fontBody) {
      overrides.push("--font-body: '" + t.fontBody + "', sans-serif;");
      var l2 = document.createElement('link');
      l2.rel = 'stylesheet';
      l2.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.fontBody).replace(/%20/g, '+') + ':wght@400;500;600&display=swap';
      document.head.appendChild(l2);
    }
    var styleTag = document.createElement('style');
    styleTag.id = 'world-theme-cached';
    styleTag.textContent = ':root { ' + overrides.join(' ') + ' }';
    document.head.appendChild(styleTag);
  } catch (e) { /* no cache yet, or malformed -- fall back to default theme, async apply will fix it */ }
})();
</script>

<script>
// ============================================================
// Multi-ruleset genericization. Same fail-open dispatch pattern as
// Bestiary/Classes -- Echoes keeps its own Category/Rarity form
// untouched; 5e gets its own real rarity tiers (name/faction/rarity),
// Generic gets name/faction only (narrative-first, no rarity/pricing
// system exists for a made-up world -- see
// routes/generateItem.js's handleGenericItemGenerate).
// ============================================================

function wireEchoesItemForm() {
  document.getElementById('gen-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('gen-submit');
    const status = document.getElementById('gen-status');
    btn.disabled = true; btn.textContent = 'Generating…';
    showGenerationOverlay(['Forging something worth finding…', 'Working out the numbers…','Weighing it in hand…','Working out what its worth…','Deciding who would want this…','Almost there…']);
    status.style.display = 'block'; status.textContent = 'Calling the generator — this can take a bit for content + art…';
    try {
      const res = await authFetch('/api/generate-item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('gen-name').value,
          category: document.getElementById('gen-field-2').value,
          rarity: document.getElementById('gen-field-3').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(formatGenerationError(data));
      status.textContent = `Generated: ${data.name} (${data.category}${data.rarity ? ' — ' + data.rarity : ''})`;
      setTimeout(() => window.location.reload(), 1200);
    } catch (err) {
      status.innerHTML = err.message;
    } finally {
      hideGenerationOverlay();
      btn.disabled = false; btn.textContent = 'Generate';
    }
  });
}

// Real backend contract, mirrors routes/generateEnemy.js's 5e branch --
// see that file's own comment for the mode/srdLibraryId request shape.
// Built with the corrected Import/Generate split from the start (R5
// Phase 5): #gen-import-view (SRD picker only) and #gen-ai-view
// (Reflavor/Homebrew toggle only) are two separate sub-views, switched
// between by promoteImportToStage1()'s two Stage-1 buttons below --
// never shown together. No FACTION field on any of the three tiers
// (Austin's call, post-launch feedback) -- mundane SRD equipment doesn't
// fit "assign this to a faction" the way real content does elsewhere,
// and it's cleaner to drop it everywhere than keep it selectively.
async function wire5eItemForm() {
  const fieldsHost = document.getElementById('gen-form-fields');
  fieldsHost.innerHTML = `
    <div id="gen-import-view" style="display:none; gap:12px; flex-wrap:wrap; align-items:flex-end; width:100%;">
      <div style="flex: 1; min-width: 220px;">
        <label for="gen-import-srd-picker" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">SRD ITEM</label>
        <select id="gen-import-srd-picker" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;"></select>
      </div>
    </div>
    <div id="gen-ai-view" style="display:none; gap:12px; flex-wrap:wrap; align-items:flex-end; width:100%;">
      <div style="flex: 1; min-width: 160px;">
        <label for="gen-name" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">NAME (optional)</label>
        <input id="gen-name" type="text" placeholder="leave blank to generate" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px; font-family: var(--font-body);">
      </div>
      <div style="flex-basis: 100%; min-width: 260px;">
        <label style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 6px;">SOURCE</label>
        <div id="gen-mode-buttons" style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" class="mode-btn" data-mode="reflavor">Reflavor<span class="mode-btn-tag">AI · SRD stats, new narrative</span></button>
          <button type="button" class="mode-btn" data-mode="homebrew">Homebrew AI<span class="mode-btn-tag">AI · fully new design</span></button>
        </div>
        <input type="hidden" id="gen-mode" value="homebrew">
      </div>
      <div id="gen-reflavor-srd-wrap" style="flex: 1; min-width: 200px; display: none;">
        <label for="gen-reflavor-srd-picker" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">SRD ITEM</label>
        <select id="gen-reflavor-srd-picker" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;"></select>
      </div>
      <div id="gen-homebrew-fields-wrap" style="display:flex; gap:12px; flex-wrap:wrap;">
        <div style="flex: 1; min-width: 160px;">
          <label for="gen-field-2" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">RARITY</label>
          <select id="gen-field-2" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;">
            <option value="">Let it choose (may be mundane)</option>
            <option value="Common">Common</option>
            <option value="Uncommon">Uncommon</option>
            <option value="Rare">Rare</option>
            <option value="Very Rare">Very Rare</option>
            <option value="Legendary">Legendary</option>
            <option value="Artifact">Artifact</option>
          </select>
        </div>
        <div style="flex: 1; min-width: 160px;">
          <label for="gen-field-4" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">TYPE</label>
          <select id="gen-field-4" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;">
            <option value="">Let it choose</option>
            <option value="weapon">Weapon</option>
            <option value="armor">Armor</option>
            <option value="wondrous">Wondrous Item</option>
            <option value="potion">Potion</option>
            <option value="scroll">Scroll</option>
            <option value="ring">Ring</option>
            <option value="rod">Rod</option>
            <option value="staff">Staff</option>
            <option value="wand">Wand</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
    </div>
  `;

  // R6 Phase 4: the Import/Reflavor picker now offers BOTH mundane
  // Equipment (srd_library.category = 'items') and the real 260 Magic
  // Items ('magic-items') in one dropdown, grouped and visually
  // distinguished -- magic items show their real rarity (+ an
  // attunement marker) right in the option label, so a Rare item
  // requiring attunement doesn't look identical to a plain Longsword.
  // Two separate fetches (routes/srdLibrary.js only takes one category
  // per call) rather than a backend change -- each call's rows are
  // already tagged with which fetch produced them, so no server-side
  // 'category' column needs to round-trip through the picker at all.
  let mundaneItems = [];
  let magicItems = [];
  try {
    const [mundaneRes, magicRes] = await Promise.all([
      authFetch('/api/srd-library?ruleset=5e&category=items'),
      authFetch('/api/srd-library?ruleset=5e&category=magic-items')
    ]);
    mundaneItems = (await mundaneRes.json()).entries || [];
    magicItems = (await magicRes.json()).entries || [];
  } catch (err) {
    console.error('Could not load SRD item list:', err);
  }
  // Rarity is real and already on the picker's light row shape
  // (listSrdEntries selects it); attunement lives inside data_json's
  // typeLine text, not a top-level column, so it isn't worth widening
  // the picker query just to show it a second time here -- it's fully
  // preserved and shown on the actual item card once imported (see
  // itemTemplate.js's rarityLine()), which is what matters for not
  // silently dropping real mechanical info.
  function magicItemLabel(it) {
    return `${it.name} (${it.rarity || 'Magic'})`;
  }
  const srdOptionsHtml =
    (mundaneItems.length ? `<optgroup label="Equipment">${mundaneItems.map((it) => `<option value="${it.id}">${it.name}</option>`).join('')}</optgroup>` : '') +
    (magicItems.length ? `<optgroup label="Magic Items">${magicItems.map((it) => `<option value="${it.id}">${magicItemLabel(it)}</option>`).join('')}</optgroup>` : '')
    || '<option value="">No SRD items available</option>';
  document.getElementById('gen-import-srd-picker').innerHTML = srdOptionsHtml;
  document.getElementById('gen-reflavor-srd-picker').innerHTML = srdOptionsHtml;

  const modeSubmitLabels = { reflavor: 'Generate', homebrew: 'Generate' };

  function updateAiModeVisibility() {
    const mode = document.getElementById('gen-mode').value;
    document.getElementById('gen-reflavor-srd-wrap').style.display = mode === 'reflavor' ? 'block' : 'none';
    document.getElementById('gen-homebrew-fields-wrap').style.display = mode === 'homebrew' ? 'flex' : 'none';
    document.querySelectorAll('#gen-mode-buttons .mode-btn').forEach((b) => {
      b.classList.toggle('mode-btn-active', b.dataset.mode === mode);
    });
    document.getElementById('gen-submit').textContent = modeSubmitLabels[mode] || 'Generate';
  }
  document.querySelectorAll('#gen-mode-buttons .mode-btn').forEach((b) => {
    b.addEventListener('click', () => {
      document.getElementById('gen-mode').value = b.dataset.mode;
      updateAiModeVisibility();
    });
  });
  updateAiModeVisibility();
  promoteImportToStage1('gen-import-view', 'gen-ai-view', 'Copy an official 5e SRD item straight in -- zero AI cost.');

  document.getElementById('gen-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('gen-submit');
    const status = document.getElementById('gen-status');
    const mode = document.getElementById('gen-mode').value;
    btn.disabled = true; btn.textContent = mode === 'import' ? 'Importing…' : 'Generating…';
    showGenerationOverlay(mode === 'import' ? ['Copying the SRD item…'] : ['Forging something worth finding…', 'Resolving base weapon/armor stats…', 'Almost there…']);
    status.style.display = 'block'; status.textContent = 'Calling the generator…';
    try {
      const body = { mode };
      if (mode === 'import') {
        body.srdLibraryId = document.getElementById('gen-import-srd-picker').value;
      } else {
        body.name = document.getElementById('gen-name').value;
        if (mode === 'reflavor') {
          body.srdLibraryId = document.getElementById('gen-reflavor-srd-picker').value;
        } else {
          body.rarity = document.getElementById('gen-field-2').value;
          body.itemType = document.getElementById('gen-field-4').value;
        }
      }

      const res = await authFetch('/api/generate-item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(formatGenerationError(data));
      status.textContent = `Generated: ${data.name}${data.rarity ? ' — ' + data.rarity : ''}${data.summary ? ' — ' + data.summary : ''}`;
      setTimeout(() => window.location.reload(), 1200);
    } catch (err) {
      status.innerHTML = err.message;
    } finally {
      hideGenerationOverlay();
      btn.disabled = false; btn.textContent = modeSubmitLabels[mode] || 'Generate';
    }
  });
}

// promoteImportToStage1()/whenReady() moved to archive/js/render.js
// (R5 Phase 6) -- shared with Enemies/Classes once a third page needed
// the identical promotion/toggle logic. See that file's own comment for
// the full pattern.

function wireGenericItemForm() {
  const fieldsHost = document.getElementById('gen-form-fields');
  fieldsHost.innerHTML = `
    <div style="flex: 1; min-width: 220px;">
      <label for="gen-name" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">NAME (optional)</label>
      <input id="gen-name" type="text" placeholder="leave blank to generate" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px; font-family: var(--font-body);">
    </div>
    <div style="flex: 1; min-width: 160px;">
      <label for="gen-field-2" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">FACTION</label>
      <select id="gen-field-2" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;">
        <option value="">Let it choose</option>
      </select>
    </div>
  `;
  populateFactionSelect('gen-field-2', { includeUnaligned: true });

  document.getElementById('gen-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('gen-submit');
    const status = document.getElementById('gen-status');
    btn.disabled = true; btn.textContent = 'Generating…';
    showGenerationOverlay(['Forging something worth finding…', 'Working out the flavor…', 'Almost there…']);
    status.style.display = 'block'; status.textContent = 'Calling the generator…';
    try {
      const res = await authFetch('/api/generate-item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('gen-name').value,
          faction: document.getElementById('gen-field-2').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(formatGenerationError(data));
      status.textContent = `Generated: ${data.name}${data.summary ? ' — ' + data.summary : ''}`;
      setTimeout(() => window.location.reload(), 1200);
    } catch (err) {
      status.innerHTML = err.message;
    } finally {
      hideGenerationOverlay();
      btn.disabled = false; btn.textContent = 'Generate';
    }
  });
}

async function initItemGenerateForm() {
  let ruleset = 'echoes';
  try {
    const res = await authFetch('/api/wizard/ruleset-options');
    const data = await res.json();
    ruleset = data.current || 'echoes';
  } catch (err) {
    console.error('Could not load this world\'s ruleset, defaulting to Echoes form:', err);
  }
  if (ruleset === '5e') {
    await wire5eItemForm();
  } else if (ruleset === 'generic') {
    wireGenericItemForm();
  } else {
    wireEchoesItemForm();
  }
}
document.addEventListener('DOMContentLoaded', initItemGenerateForm);
</script>

<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_category_config_cache');
    if (!cached) return;
    var categoryConfig = JSON.parse(cached);
    var site = categoryConfig._site || {};
    if (site.title) {
      var titleEl = document.getElementById('site-title-text');
      if (titleEl) titleEl.textContent = site.title;
      document.title = document.title.indexOf(' \u2014 ') !== -1
        ? document.title.replace(/ \u2014 .+$/, ' \u2014 ' + site.title)
        : site.title;
    }
    if (site.tagline) {
      var taglineEl = document.getElementById('hero-tagline');
      if (taglineEl) taglineEl.textContent = site.tagline;
    }
    if (site.footer) {
      var footerEl = document.getElementById('site-footer-text');
      if (footerEl) footerEl.textContent = site.footer;
    }
    Object.keys(categoryConfig).forEach(function(key) {
      if (key === '_site') return;
      var cfg = categoryConfig[key];
      var navLink = document.getElementById('nav-' + key);
      if (navLink) {
        if (cfg.enabled === false) navLink.style.display = 'none';
        else if (cfg.label) navLink.textContent = cfg.label;
      }
      var card = document.getElementById('card-' + key);
      if (card) {
        if (cfg.enabled === false) {
          card.style.display = 'none';
        } else if (cfg.label) {
          var h2 = card.querySelector('h2');
          if (h2) h2.textContent = cfg.label;
        }
      }
      if (cfg.blurb) {
        var cardDesc = document.getElementById('card-desc-' + key);
        if (cardDesc) cardDesc.textContent = cfg.blurb;
      }
      if (document.body.dataset.category === key) {
        if (cfg.label) {
          var pageTitle = document.getElementById('page-title');
          var crumbLabel = document.getElementById('crumb-label');
          if (pageTitle) pageTitle.textContent = cfg.label;
          if (crumbLabel) crumbLabel.textContent = cfg.label;
          document.title = document.title.replace(/^[^\u2014]+/, cfg.label + ' ');
        }
        if (cfg.blurb) {
          var pageBlurb = document.getElementById('page-blurb');
          if (pageBlurb) pageBlurb.textContent = cfg.blurb;
        }
      }
    });
  } catch (e) { /* no cache yet, or malformed -- async apply will fix it */ }
})();
</script>
