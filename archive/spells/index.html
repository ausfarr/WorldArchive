<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spells — The Archive</title>
<link rel="stylesheet" href="../css/style.css">
<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_theme_cache');
    if (!cached) return;
    var t = JSON.parse(cached);
    var hex = /^#[0-9a-fA-F]{6}$/;
    var overrides = [];
    if (hex.test(t.backgroundColor)) overrides.push('--bg-void: ' + t.backgroundColor + ';');
    if (hex.test(t.panelColor)) overrides.push('--bg-panel: ' + t.panelColor + '; --bg-panel-raised: ' + t.panelColor + ';');
    if (hex.test(t.inkColor)) overrides.push('--ink: ' + t.inkColor + ';');
    if (hex.test(t.primaryColor)) overrides.push('--neon-primary: ' + t.primaryColor + ';');
    if (hex.test(t.secondaryColor)) overrides.push('--neon-cyan: ' + t.secondaryColor + ';');
    if (t.fontDisplay) {
      overrides.push("--font-display: '" + t.fontDisplay + "', sans-serif;");
      var l1 = document.createElement('link');
      l1.rel = 'stylesheet';
      l1.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.fontDisplay).replace(/%20/g, '+') + ':wght@400;600;700&display=swap';
      document.head.appendChild(l1);
    }
    if (t.fontBody) {
      overrides.push("--font-body: '" + t.fontBody + "', sans-serif;");
      var l2 = document.createElement('link');
      l2.rel = 'stylesheet';
      l2.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.fontBody).replace(/%20/g, '+') + ':wght@400;500;600&display=swap';
      document.head.appendChild(l2);
    }
    var styleTag = document.createElement('style');
    styleTag.id = 'world-theme-cached';
    styleTag.textContent = ':root { ' + overrides.join(' ') + ' }';
    document.head.appendChild(styleTag);
  } catch (e) { /* no cache yet, or malformed -- fall back to default theme, async apply will fix it */ }
})();
</script>

</head>
<body data-category="spells">

<script src="/js/siteHeader.js?v=v1.1.1"></script>

<div class="wrap">
  <div class="crumb"><a href="../index.html">Archive</a><span class="sep">/</span><span id="crumb-label">Spells</span></div>
  <h1 style="font-family: var(--font-display); text-transform: uppercase; margin: 20px 0 8px;" id="page-title">Spells</h1>
  <p style="color: var(--ink-dim); max-width: 640px; margin: 0 0 24px;" id="page-blurb"></p>


<div class="sheet" style="margin: 0 0 40px; padding: 24px 32px;">
  <p class="sheet-eyebrow" style="margin: 0 0 8px;">Generate New Entry</p>
  <form id="gen-form" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;">
    <div id="gen-form-fields" style="display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end;"></div>
    <button type="submit" id="gen-submit" style="background: var(--neon-primary); color: var(--bg-void); border: none; padding: 10px 20px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; font-weight: 600;">Generate</button>
  </form>
  <p id="gen-status" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-faint); margin: 12px 0 0; display: none;"></p>
  <p id="gen-unavailable" style="font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-faint); margin: 0; display: none;"></p>
</div>
<script>
// ============================================================
// Multi-ruleset genericization. Spells has NO Echoes/generic
// equivalent at all (see lib/rulesets/index.js -- only 5e has a
// `spells` registry entry), so unlike every other category page here
// there's no Echoes fallback form to fail open to -- an Echoes/generic
// world instead sees a plain explanation and no generate form, same
// message shape routes/generateSpell.js's requireCategoryAvailable
// gate would return if the form were submitted anyway.
// ============================================================

// Real backend contract, mirrors routes/generateEnemy.js's 5e branch --
// see that file's own comment for the mode/srdLibraryId request shape.
// Built with the corrected Import/Generate split from the start (same
// pattern archive/items/index.html and archive/classes/index.html use):
// #gen-import-view (SRD picker only) and #gen-ai-view (Reflavor/Homebrew
// toggle only) are two separate sub-views, switched between by the
// shared promoteImportToStage1() (archive/js/render.js) -- never shown
// together. No FACTION field, matching this category's existing Homebrew
// form, which never exposed one either -- spells don't carry a faction
// concept in this app's UI the way NPCs/Items/Locations do.
async function wire5eSpellForm() {
  const fieldsHost = document.getElementById('gen-form-fields');
  fieldsHost.innerHTML = `
    <div id="gen-import-view" style="display:none; gap:12px; flex-wrap:wrap; align-items:flex-end; width:100%;">
      <div style="flex: 1; min-width: 220px;">
        <label for="gen-import-srd-picker" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">SRD SPELL</label>
        <select id="gen-import-srd-picker" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;"></select>
      </div>
    </div>
    <div id="gen-ai-view" style="display:none; gap:12px; flex-wrap:wrap; align-items:flex-end; width:100%;">
      <div style="flex: 1; min-width: 200px;">
        <label for="gen-name" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">NAME (optional)</label>
        <input id="gen-name" type="text" placeholder="leave blank to generate" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px; font-family: var(--font-body);">
      </div>
      <div style="flex-basis: 100%; min-width: 260px;">
        <label style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 6px;">SOURCE</label>
        <div id="gen-mode-buttons" style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" class="mode-btn" data-mode="reflavor">Reflavor<span class="mode-btn-tag">AI · SRD spell, new narrative</span></button>
          <button type="button" class="mode-btn" data-mode="homebrew">Homebrew AI<span class="mode-btn-tag">AI · fully new design</span></button>
        </div>
        <input type="hidden" id="gen-mode" value="homebrew">
      </div>
      <div id="gen-reflavor-srd-wrap" style="flex: 1; min-width: 200px; display: none;">
        <label for="gen-reflavor-srd-picker" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">SRD SPELL</label>
        <select id="gen-reflavor-srd-picker" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;"></select>
      </div>
      <div id="gen-homebrew-fields-wrap" style="display:flex; gap:12px; flex-wrap:wrap;">
        <div style="flex: 1; min-width: 120px;">
          <label for="gen-field-2" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">LEVEL (optional)</label>
          <input id="gen-field-2" type="number" min="0" max="9" placeholder="0-9" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px; font-family: var(--font-body);">
        </div>
        <div style="flex: 1; min-width: 160px;">
          <label for="gen-field-3" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">SCHOOL (optional)</label>
          <select id="gen-field-3" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;">
            <option value="">Let it choose</option>
            <option value="Abjuration">Abjuration</option>
            <option value="Conjuration">Conjuration</option>
            <option value="Divination">Divination</option>
            <option value="Enchantment">Enchantment</option>
            <option value="Evocation">Evocation</option>
            <option value="Illusion">Illusion</option>
            <option value="Necromancy">Necromancy</option>
            <option value="Transmutation">Transmutation</option>
          </select>
        </div>
      </div>
    </div>
  `;

  let srdSpells = [];
  try {
    const res = await authFetch('/api/srd-library?ruleset=5e&category=spells');
    const data = await res.json();
    srdSpells = data.entries || [];
  } catch (err) {
    console.error('Could not load SRD spell list:', err);
  }
  const srdOptionsHtml = srdSpells
    .map((s) => `<option value="${s.id}">${s.name}${s.level != null ? ` (Level ${s.level})` : ''}</option>`)
    .join('') || '<option value="">No SRD spells available</option>';
  document.getElementById('gen-import-srd-picker').innerHTML = srdOptionsHtml;
  document.getElementById('gen-reflavor-srd-picker').innerHTML = srdOptionsHtml;

  const modeSubmitLabels = { reflavor: 'Generate', homebrew: 'Generate' };

  function updateAiModeVisibility() {
    const mode = document.getElementById('gen-mode').value;
    document.getElementById('gen-reflavor-srd-wrap').style.display = mode === 'reflavor' ? 'block' : 'none';
    document.getElementById('gen-homebrew-fields-wrap').style.display = mode === 'homebrew' ? 'flex' : 'none';
    document.querySelectorAll('#gen-mode-buttons .mode-btn').forEach((b) => {
      b.classList.toggle('mode-btn-active', b.dataset.mode === mode);
    });
    document.getElementById('gen-submit').textContent = modeSubmitLabels[mode] || 'Generate';
  }
  document.querySelectorAll('#gen-mode-buttons .mode-btn').forEach((b) => {
    b.addEventListener('click', () => {
      document.getElementById('gen-mode').value = b.dataset.mode;
      updateAiModeVisibility();
    });
  });
  updateAiModeVisibility();
  promoteImportToStage1('gen-import-view', 'gen-ai-view', 'Copy an official 5e SRD spell straight in -- zero AI cost.');

  document.getElementById('gen-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('gen-submit');
    const status = document.getElementById('gen-status');
    const mode = document.getElementById('gen-mode').value;
    btn.disabled = true; btn.textContent = mode === 'import' ? 'Importing…' : 'Generating…';
    showGenerationOverlay(mode === 'import' ? ['Copying the SRD spell…'] : ['Writing the incantation…', 'Working out the scaling…', 'Almost there…']);
    status.style.display = 'block'; status.textContent = 'Calling the generator…';
    try {
      const body = { mode };
      if (mode === 'import') {
        body.srdLibraryId = document.getElementById('gen-import-srd-picker').value;
      } else {
        body.name = document.getElementById('gen-name').value;
        if (mode === 'reflavor') {
          body.srdLibraryId = document.getElementById('gen-reflavor-srd-picker').value;
        } else {
          const level = document.getElementById('gen-field-2').value;
          body.level = level ? Number(level) : undefined;
          body.school = document.getElementById('gen-field-3').value;
        }
      }

      const res = await authFetch('/api/generate-spell', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(formatGenerationError(data));
      status.textContent = `Generated: ${data.name}${data.summary ? ' — ' + data.summary : ''}`;
      setTimeout(() => window.location.reload(), 1200);
    } catch (err) {
      status.innerHTML = err.message;
    } finally {
      hideGenerationOverlay();
      btn.disabled = false; btn.textContent = modeSubmitLabels[mode] || 'Generate';
    }
  });
}

function showSpellsUnavailable(ruleset) {
  document.getElementById('gen-form').style.display = 'none';
  const note = document.getElementById('gen-unavailable');
  note.style.display = 'block';
  note.textContent = ruleset === 'echoes'
    ? "Echoes of the Neon has no spell system -- Spells isn't part of this world's ruleset."
    : "This world's ruleset doesn't have a Spells category yet.";
}

async function initSpellGenerateForm() {
  let ruleset = 'echoes';
  try {
    const res = await authFetch('/api/wizard/ruleset-options');
    const data = await res.json();
    ruleset = data.current || 'echoes';
  } catch (err) {
    console.error('Could not load this world\'s ruleset:', err);
  }
  if (ruleset === '5e') {
    await wire5eSpellForm();
  } else {
    showSpellsUnavailable(ruleset);
  }
}
document.addEventListener('DOMContentLoaded', initSpellGenerateForm);
</script>


  <div class="sheet" style="margin: 0 0 20px; padding: 16px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
  <button id="export-category-btn" style="background: var(--bg-panel-raised); color: var(--ink); border: 1px solid var(--border-line); padding: 8px 16px; font-family: var(--font-display); text-transform: uppercase; font-size: 0.78rem; cursor: pointer;">Download PDF</button>
  <label style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-dim); display: flex; align-items: center; gap: 6px;">
    <input type="checkbox" id="export-include-images" checked> Include images
  </label>
  <span id="export-category-status" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-faint);"></span>
</div>

  <div class="entry-grid" id="entry-grid"></div>
</div>

<footer class="site-footer">
  <div class="wrap"><span id="site-footer-text">CHRONICLED</span><span class="app-version">v0.7</span></div>
</footer>

<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_category_config_cache');
    if (!cached) return;
    var categoryConfig = JSON.parse(cached);
    var site = categoryConfig._site || {};
    if (site.title) {
      var titleEl = document.getElementById('site-title-text');
      if (titleEl) titleEl.textContent = site.title;
      document.title = document.title.indexOf(' — ') !== -1
        ? document.title.replace(/ — .+$/, ' — ' + site.title)
        : site.title;
    }
    if (site.tagline) {
      var taglineEl = document.getElementById('hero-tagline');
      if (taglineEl) taglineEl.textContent = site.tagline;
    }
    if (site.footer) {
      var footerEl = document.getElementById('site-footer-text');
      if (footerEl) footerEl.textContent = site.footer;
    }
    Object.keys(categoryConfig).forEach(function(key) {
      if (key === '_site') return;
      var cfg = categoryConfig[key];
      var navLink = document.getElementById('nav-' + key);
      if (navLink) {
        if (cfg.enabled === false) navLink.style.display = 'none';
        else if (cfg.label) navLink.textContent = cfg.label;
      }
      var card = document.getElementById('card-' + key);
      if (card) {
        if (cfg.enabled === false) {
          card.style.display = 'none';
        } else if (cfg.label) {
          var h2 = card.querySelector('h2');
          if (h2) h2.textContent = cfg.label;
        }
      }
      if (cfg.blurb) {
        var cardDesc = document.getElementById('card-desc-' + key);
        if (cardDesc) cardDesc.textContent = cfg.blurb;
      }
      if (document.body.dataset.category === key) {
        if (cfg.label) {
          var pageTitle = document.getElementById('page-title');
          var crumbLabel = document.getElementById('crumb-label');
          if (pageTitle) pageTitle.textContent = cfg.label;
          if (crumbLabel) crumbLabel.textContent = cfg.label;
          document.title = document.title.replace(/^[^—]+/, cfg.label + ' ');
        }
        if (cfg.blurb) {
          var pageBlurb = document.getElementById('page-blurb');
          if (pageBlurb) pageBlurb.textContent = cfg.blurb;
        }
      }
    });
  } catch (e) { /* no cache yet, or malformed -- async apply will fix it */ }
})();
</script>
<script src="/config.js"></script>
<script src="/version.js"></script>
<script>
  if (window.APP_VERSION) {
    document.querySelectorAll('.app-version').forEach(function(el) {
      el.textContent = window.APP_VERSION;
    });
  }
</script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script src="../js/rulesetManualForms.js?v=v1.1.1"></script>
<script>
  requireAuth().then((session) => {
    if (!session) return; // requireAuth already redirected to /login.html
    renderAuthStatus();
    applySpellsNavVisibility();
    applyCategoryConfig();
    applySiteTheme();
    loadAndRenderCategoryIndex("spells");
    wireCategoryExportButton();
    wireCreateEntryCollapse();
    applyAiEnabledGating();
  });
</script>

</body>
</html>
