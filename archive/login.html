<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Your World — Chronicled</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="site-title"><a href="index.html">Chronicled</a></div>
  </div>
</header>

<div class="wrap" style="max-width: 420px; padding-top: 60px;">
  <div class="sheet" style="padding: 32px;">
    <h1 style="font-family: var(--font-display); text-transform: uppercase; font-size: 1.4rem; margin: 0 0 6px;" id="form-title">Save Your World</h1>
    <p style="color: var(--ink-dim); font-size: 0.88rem; margin: 0 0 24px;" id="form-sub">Add an email and password so you don't lose access — free either way.</p>

    <form id="auth-form">
      <label for="email" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">EMAIL</label>
      <input id="email" type="email" required autocomplete="email" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 10px 12px; font-family: var(--font-body); margin-bottom: 16px;">

      <label for="password" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">PASSWORD</label>
      <input id="password" type="password" required autocomplete="current-password" minlength="6" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 10px 12px; font-family: var(--font-body); margin-bottom: 20px;">

      <button type="submit" id="submit-btn" style="width: 100%; background: var(--neon-primary); color: var(--bg-void); border: none; padding: 12px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; cursor: pointer; font-weight: 600;">Save</button>
    </form>

    <p id="status" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-faint); margin: 16px 0 0; display: none;"></p>

    <div style="display:flex; align-items:center; gap:12px; margin: 20px 0;">
      <div style="flex:1; height:1px; background: var(--border-line);"></div>
      <span style="font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint);">OR</span>
      <div style="flex:1; height:1px; background: var(--border-line);"></div>
    </div>

    <!-- One-click OAuth, alongside (not instead of) email+password. v1.1:
         whether this links the current anonymous session in place or
         starts a brand-new sign-in is decided at click time -- see
         handleOAuthClick() below. -->
    <button type="button" id="oauth-google-btn" style="width:100%; background: var(--bg-panel-raised); color: var(--ink); border: 1px solid var(--border-line); padding: 12px; font-family: var(--font-body); cursor: pointer; margin-bottom: 10px;">Continue with Google</button>
    <button type="button" id="oauth-discord-btn" style="width:100%; background: var(--bg-panel-raised); color: var(--ink); border: 1px solid var(--border-line); padding: 12px; font-family: var(--font-body); cursor: pointer;">Continue with Discord</button>

    <p style="font-size: 0.85rem; color: var(--ink-dim); margin: 20px 0 0; text-align: center;">
      <span id="toggle-mode-prompt">Already have an account?</span>
      <a href="#" id="toggle-mode">Log in</a>
    </p>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">CHRONICLED<span class="app-version">v0.7</span><a href="licenses.html" class="footer-license-link">Content Licenses</a></div>
</footer>

<script src="/config.js"></script>
<script src="/version.js"></script>
<script>
  if (window.APP_VERSION) {
    document.querySelectorAll('.app-version').forEach(function(el) {
      el.textContent = window.APP_VERSION;
    });
  }
</script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/auth.js?v=v1.1.1"></script>
<script>
// v1.1 anonymous-by-default access: by the time anyone reaches this page
// they'll almost always already have a real (not fake) anonymous Supabase
// session, established silently by requireAuth() the moment they first
// used the app (see archive/js/auth.js). So this page's job shifted from
// "the mandatory gate to enter the app" to "save your progress or log
// into an existing account" -- "save" mode upgrades the CURRENT session
// in place (same world, same everything already generated) rather than
// creating an unrelated second account.
let mode = "save"; // "save" | "signin"

function applyMode(isSave) {
  mode = isSave ? "save" : "signin";
  document.getElementById("form-title").textContent = isSave ? "Save Your World" : "Log In";
  document.getElementById("form-sub").textContent = isSave
    ? "Add an email and password so you don't lose access — free either way."
    : "Access your Chronicled account.";
  document.getElementById("submit-btn").textContent = isSave ? "Save" : "Log In";
  document.getElementById("toggle-mode-prompt").textContent = isSave
    ? "Already have an account?"
    : "Don't have an account yet?";
  document.getElementById("toggle-mode").textContent = isSave ? "Log in" : "Save your world";
}

document.getElementById("toggle-mode").addEventListener("click", (e) => {
  e.preventDefault();
  applyMode(mode !== "save");
});

// Sync the DOM to the "save" default above -- the static markup still
// shows "Log In" copy, so this has to run unconditionally on load, not
// just behind the ?mode= check below (that was the actual v1.1 default
// change; the query param is now a no-op kept only for marketing links
// that still pass it).
applyMode(mode === "save");

// ?mode=signin lands directly in signin mode instead of the default
// (e.g. for a future "Log In" link that specifically wants that, unlike
// today's marketing CTAs, which all point at the app root now).
if (new URLSearchParams(window.location.search).get("mode") === "signin") {
  applyMode(false);
}

// Links the OAuth identity to the CURRENT anonymous session in place when
// one exists (the common case), or falls back to a normal OAuth sign-in
// otherwise -- see archive/js/auth.js's linkOAuthIdentity()/
// signInWithOAuth() for the distinction. Both do a full-page redirect, so
// nothing after the await runs in the success case.
async function handleOAuthClick(provider, label) {
  const status = document.getElementById("status");
  status.style.display = "block";
  status.textContent = `Redirecting to ${label}…`;
  try {
    const session = await getCurrentSession();
    if (session && session.user.is_anonymous) {
      await linkOAuthIdentity(provider);
    } else {
      await signInWithOAuth(provider);
    }
  } catch (err) {
    status.textContent = "Error: " + err.message;
  }
}

document.getElementById("oauth-google-btn").addEventListener("click", () => handleOAuthClick("google", "Google"));
document.getElementById("oauth-discord-btn").addEventListener("click", () => handleOAuthClick("discord", "Discord"));

document.getElementById("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("submit-btn");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.style.display = "block";
  status.textContent = mode === "save" ? "Saving…" : "Logging in…";
  try {
    if (mode === "save") {
      const session = await getCurrentSession();
      if (session && session.user.is_anonymous) {
        await upgradeAnonymousAccount(email, password);
        status.textContent = "Saved — check your inbox to confirm your email if asked. Your world stays exactly as it is.";
      } else {
        await signUp(email, password);
        status.textContent = "Account created. Check your inbox to confirm your email if asked.";
      }
      window.location.href = await getPostLoginDestination();
    } else {
      await signIn(email, password);
      window.location.href = await getPostLoginDestination();
    }
  } catch (err) {
    status.textContent = "Error: " + err.message;
    btn.disabled = false;
  }
});

// Skip straight past this page only for an already-permanent account --
// an anonymous session should still see the save/upgrade form, not get
// redirected away from the one place that lets them secure it.
(async () => {
  const session = await getCurrentSession();
  if (session && !session.user.is_anonymous) window.location.href = await getPostLoginDestination();
})();
</script>

</body>
</html>
