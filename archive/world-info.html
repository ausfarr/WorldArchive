<div class="wrap" style="max-width: 820px; padding-top: 40px; padding-bottom: 80px;">
  <div class="crumb"><a href="index.html">Archive</a><span class="sep">/</span><span>World Info</span></div>
  <h1 style="font-family: var(--font-display); text-transform: uppercase; margin: 20px 0 8px;">World Info</h1>
  <p style="color: var(--ink-dim); max-width: 640px; margin: 0 0 32px;">A living reference for everything set up about this world — genre, lore, attribute names, and skills. Always reflects the current state; nothing here is cached or pre-written.</p>

  <div id="loading" style="font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-faint);">Loading…</div>
  <div id="world-mood-board" style="display:none; margin-bottom: 28px;"></div>
  <div id="content" style="display:none;"></div>
</div>

<footer class="site-footer">
  <div class="wrap"><span id="site-footer-text">CHRONICLED</span><span class="app-version">v0.7</span><a href="licenses.html" class="footer-license-link">Content Licenses</a></div>
</footer>

<style>
  .info-section {
    border: 1px solid var(--border-line); background: var(--bg-panel-raised);
    padding: 20px 24px; margin-bottom: 20px;
  }
  .info-section h2 {
    font-family: var(--font-display); text-transform: uppercase; font-size: 1rem;
    color: var(--neon-cyan); margin: 0 0 14px; border-bottom: 1px solid var(--border-line-soft); padding-bottom: 10px;
  }
  .info-row { font-size: 0.88rem; margin: 6px 0; color: var(--ink-dim); line-height: 1.5; }
  .info-row strong { color: var(--ink); }
  .info-empty { color: var(--ink-faint); font-size: 0.85rem; font-style: italic; }
  .info-hint { font-size: 0.82rem; color: var(--ink-faint); line-height: 1.5; margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border-line-soft); }
  .stat-grid, .skill-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
  }
  .stat-card, .skill-card {
    background: var(--bg-void); border: 1px solid var(--border-line-soft); padding: 12px 14px;
  }
  .stat-card .name, .skill-card .name {
    font-family: var(--font-display); text-transform: uppercase; font-size: 0.85rem; color: var(--ink); margin-bottom: 4px;
  }
  .stat-card .canon, .skill-card .canon {
    font-family: var(--font-mono); font-size: 0.62rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .stat-card .desc, .skill-card .desc { font-size: 0.82rem; color: var(--ink-dim); margin-top: 6px; line-height: 1.4; }
  .lore-title-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    font-family: var(--font-mono); font-size: 0.68rem; border: 1px solid var(--border-line);
    padding: 3px 8px; color: var(--ink-dim);
  }
  .lore-section { margin-bottom: 22px; }
  .lore-section:last-child { margin-bottom: 0; }
  .lore-section h3 {
    font-family: var(--font-display); text-transform: uppercase; font-size: 0.88rem;
    color: var(--ink); margin: 0 0 8px; letter-spacing: 0.02em;
  }
  .lore-optional-tag {
    font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-faint);
    text-transform: uppercase; letter-spacing: 0.04em; font-weight: normal;
  }
  .lore-para { font-size: 0.88rem; color: var(--ink-dim); line-height: 1.6; margin: 0 0 10px; }
  .lore-para:last-child { margin-bottom: 0; }
</style>

<script src="/version.js"></script>

  if (window.APP_VERSION) {
    document.querySelectorAll('.app-version').forEach(function(el) {
      el.textContent = window.APP_VERSION;
    });

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script src="js/render.js?v=v1.2"></script>
<script src="js/worldArtActions.js?v=v1.2"></script>
<script>
const CANONICAL_STATS = [
  { key: "body", mechanic: "Max health & physical resilience" },
  { key: "reflex", mechanic: "Dodge chance, accuracy, move speed" },
  { key: "knowledge", mechanic: "Max energy & skill-based effects" },
  { key: "presence", mechanic: "Buff/debuff potency" },
  { key: "sanity", mechanic: "Max health, resistance to breaking" },
  { key: "fate", mechanic: "Crit chance & max energy" }
];

function section(title, innerHtml) {
  return `<div class="info-section"><h2>${title}</h2>${innerHtml}</div>`;
}

function escapeHtmlWI(str) {
  if (str == null) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// Converts a section's raw prose (paragraphs separated by blank lines,
// same format every *ContentPrompt.js schema asks Claude for) into
// clean <p> tags -- same nl2p() pattern used in routes/wizardFactions.js
// for bridging faction seed text into HTML.
function nl2pWI(text) {
  return (text || "")
    .split(/\n\n+/)
    .map((para) => `<p class="lore-para">${escapeHtmlWI(para).replace(/\n/g, "<br>")}</p>`)
    .join("\n");
}

function renderContent(data) {
  let html = "";

  // World Identity
  const s1 = data.step1 || {};
  const genre = Array.isArray(s1.genre) ? s1.genre.join(", ") : (s1.genre || "");
  const identityRows = [
    s1.worldName ? `<div class="info-row"><strong>World Name:</strong> ${s1.worldName}</div>` : "",
    genre ? `<div class="info-row"><strong>Genre:</strong> ${genre}</div>` : "",
    s1.scale ? `<div class="info-row"><strong>Scale:</strong> ${s1.scale}</div>` : "",
    s1.era ? `<div class="info-row"><strong>Era:</strong> ${s1.era}</div>` : "",
    s1.supernaturalSystem ? `<div class="info-row"><strong>Supernatural/Speculative System:</strong> ${s1.supernaturalSystem}</div>` : "",
    s1.coreTension ? `<div class="info-row"><strong>Core Tension:</strong> ${s1.coreTension}</div>` : "",
    s1.inspirations ? `<div class="info-row"><strong>Inspirations:</strong> ${s1.inspirations}</div>` : "",
    s1.nonNegotiables ? `<div class="info-row"><strong>Non-Negotiables:</strong> ${s1.nonNegotiables}</div>` : ""
  ].filter(Boolean).join("");
  const identityHint = '<p class="info-hint">"World" here means this entire setting/universe as a whole — not necessarily one planet. Scale is where that gets defined (e.g. a single city, a whole planet, a multi-system span, or something bigger); everything else on this page inherits from what\'s set here.</p>';
  html += section("World Identity", identityHint + (identityRows || '<div class="info-empty">Not filled in yet.</div>'));

  // Lore -- full section text, not just titles. Each section renders as
  // its own labeled subsection with full formatted prose, so this page
  // is a real standalone reference rather than a pointer back to Step 3.
  const sections = data.loreSections || [];
  const loreHtml = sections.length
    ? sections.map((s) => `
        <div class="lore-section">
          <h3>${escapeHtmlWI(s.title)}${s.core ? "" : ' <span class="lore-optional-tag">optional</span>'}</h3>
          ${s.content ? nl2pWI(s.content) : '<div class="info-empty">No content saved for this section.</div>'}
        </div>
      `).join("")
    : '<div class="info-empty">No lore generated/imported yet.</div>';
  html += section("World Lore", loreHtml);

  // Stat System / Skills (Echoes only) -- CANONICAL_STATS and the
  // weapon/field-skill display below are Echoes' own stat_system_json/
  // skill_system_json shape; a 5e or Generic world never populates those
  // columns in the first place (5e has its own ability scores, Generic
  // has its own generic_system_json), so these sections were always
  // going to render "Not configured yet." on any non-Echoes world
  // regardless of real setup state. Gate absent entirely -- same "absent,
  // not just empty" treatment Races/Species (below) already gets for
  // non-5e worlds -- rather than showing a permanently-empty section.
  // Fails open (renders) for a missing/undefined ruleset, since a
  // pre-ruleset-project world's data predates this field and was always
  // Echoes-shaped.
  // TODO: Generic worlds have their own generic_system_json attribute
  // system and arguably deserve their own World Info section reading
  // from it instead of just disappearing here -- real future
  // enhancement, not built this session (R5 Phase 2 scope).
  const isEchoesRuleset = !data.ruleset || data.ruleset === "echoes";
  if (isEchoesRuleset) {
    // Stat System
    const stats = data.statSystem;
    const statCards = CANONICAL_STATS.map(({ key, mechanic }) => {
      const s = (stats && stats[key]) || {};
      return `
        <div class="stat-card">
          <div class="name">${s.label || key}</div>
          <div class="canon">${key} — ${mechanic}</div>
          ${s.description ? `<div class="desc">${s.description}</div>` : ""}
        </div>
      `;
    }).join("");
    html += section("Attributes", stats ? `<div class="stat-grid">${statCards}</div>` : '<div class="info-empty">Not configured yet.</div>');

    // Skills
    const skillSystem = data.skillSystem;
    let skillsHtml = "";
    if (skillSystem && skillSystem.weaponSkills) {
      const weaponCards = Object.entries(skillSystem.weaponSkills).map(([canon, label]) => `
        <div class="skill-card">
          <div class="name">${label}</div>
          <div class="canon">${canon}</div>
        </div>
      `).join("");
      skillsHtml += `<div class="info-row" style="margin-bottom:10px;"><strong>Weapon Skills</strong></div><div class="skill-grid" style="margin-bottom:20px;">${weaponCards}</div>`;
    }
    if (skillSystem && Array.isArray(skillSystem.fieldSkills) && skillSystem.fieldSkills.length) {
      const fieldCards = skillSystem.fieldSkills.map((s) => `
        <div class="skill-card">
          <div class="name">${s.name}</div>
          ${s.description ? `<div class="desc">${s.description}</div>` : ""}
        </div>
      `).join("");
      skillsHtml += `<div class="info-row" style="margin-bottom:10px;"><strong>Field Skills</strong> — ranked 0-100 for any character</div><div class="skill-grid">${fieldCards}</div>`;
    }
    html += section("Skills", skillsHtml || '<div class="info-empty">Not configured yet.</div>');
  }

  // Races/Species (R4 Phase 3, 5e only) -- live-pulled every load, same
  // pattern as Attributes/Skills above. Absent entirely (not even an
  // empty section) for a non-5e world, since raceSystem is null there --
  // this is a 5e-specific mechanical concept, not a universal one.
  const raceSystem = data.raceSystem;
  if (Array.isArray(raceSystem) && raceSystem.length) {
    const raceCards = raceSystem.map((r) => {
      const asiText = Object.entries(r.abilityScoreIncrease || {})
        .filter(([, v]) => v)
        .map(([k, v]) => `${k.toUpperCase()} +${v}`)
        .join(", ") || "—";
      const traitsHtml = (r.traits || []).map((t) => `<div class="desc"><strong>${escapeHtmlWI(t.name)}:</strong> ${escapeHtmlWI(t.description)}</div>`).join("");
      return `
        <div class="stat-card">
          <div class="name">${escapeHtmlWI(r.name)}</div>
          <div class="canon">${escapeHtmlWI(r.size || "Medium")} · Speed ${r.speed || 30} ft. · ${asiText}</div>
          ${r.choiceNote ? `<div class="desc" style="font-style:italic;">${escapeHtmlWI(r.choiceNote)}</div>` : ""}
          ${traitsHtml}
          ${r.flavor ? `<div class="desc">${escapeHtmlWI(r.flavor)}</div>` : ""}
        </div>
      `;
    }).join("");
    html += section("Races &amp; Species", `<div class="stat-grid">${raceCards}</div>`);
  }

  document.getElementById("content").innerHTML = html;
  document.getElementById("loading").style.display = "none";
  document.getElementById("content").style.display = "block";
}

async function init() {
  const session = await requireAuth();
  if (!session) return;
  renderAuthStatus();
  applySpellsNavVisibility();
  applyCategoryConfig();
  applySiteTheme();
  applyAiEnabledGating(); // hides the mood board's Generate Image button (.ai-action) for AI-off accounts; Upload stays visible
  try {
    const res = await authFetch("/api/wizard/review");
    if (!res.ok) throw new Error("Failed to load world info.");
    const data = await res.json();
    renderContent(data);
  } catch (err) {
    console.error("Could not load world info:", err);
    document.getElementById("loading").textContent = "Could not load world info.";
  }
  loadWorldMoodBoard();
}

// Separate, independent fetch -- the mood board not existing yet (a
// world that skipped art at Step 6 -- see wizard-style.html's v0.9
// Manual Wizard Path choice panel -- or where the generation step
// failed silently) shouldn't block or blank out the rest of this page's
// content. When it doesn't exist, shows a Generate/Upload pending slot
// (archive/js/worldArtActions.js) instead of just hiding the section.
async function loadWorldMoodBoard() {
  const host = document.getElementById("world-mood-board");
  try {
    const res = await authFetch("/api/world-art/mood-board");
    if (!res.ok) return;
    const { exists, url } = await res.json();
    if (!exists || !url) {
      renderMoodBoardPendingSlot(host);
      return;
    }
    host.innerHTML = `<img src="${url}" alt="World mood board" style="width:100%; max-height:340px; object-fit:cover; border:1px solid var(--border-line);">`;
    host.style.display = "block";
  } catch (err) {
    console.error("Could not load world mood board:", err);
  }
}

init();
</script>

<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_category_config_cache');
    if (!cached) return;
    var categoryConfig = JSON.parse(cached);
    var site = categoryConfig._site || {};
    if (site.title) {
      var titleEl = document.getElementById('site-title-text');
      if (titleEl) titleEl.textContent = site.title;
      document.title = document.title.indexOf(' \u2014 ') !== -1
        ? document.title.replace(/ \u2014 .+$/, ' \u2014 ' + site.title)
        : site.title;
    }
    if (site.footer) {
      var footerEl = document.getElementById('site-footer-text');
      if (footerEl) footerEl.textContent = site.footer;
    }
    Object.keys(categoryConfig).forEach(function(key) {
      if (key === '_site') return;
      var cfg = categoryConfig[key];
      var navLink = document.getElementById('nav-' + key);
      if (navLink) {
        if (cfg.enabled === false) navLink.style.display = 'none';
        else if (cfg.label) navLink.textContent = cfg.label;
      }
    });
  } catch (e) { /* no cache yet, or malformed -- async apply will fix it */ }
})();
</script>

</body>
</html>
