<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="css/style.css">

</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="site-title"><a href="index.html"><span id="site-title-text">The <span class="accent">Archive</span></span></a></div>
    <nav class="site-nav">
      <a href="factions/index.html" id="nav-factions">Factions</a>
      <a href="npcs/index.html" id="nav-npcs">NPCs</a>
      <a href="enemies/index.html" id="nav-enemies">Bestiary</a>
      <a href="classes/index.html" id="nav-classes">Classes</a>
      <a href="items/index.html" id="nav-items">Items</a>
      <a href="logs/index.html" id="nav-logs">Logs</a>
      <a href="survivors/index.html" id="nav-survivors">PCs</a>
      <a href="locations/index.html" id="nav-locations">Locations</a>
      <a href="campaigns/index.html" id="nav-quests">Quests</a>
      <a href="campaign-arcs/index.html" id="nav-campaign-arcs">Campaigns</a>
      <a href="map.html" id="nav-map">Map</a>
      <a href="world-info.html" id="nav-world-info">World Info</a>
      <a href="settings.html" id="nav-settings">Settings</a>
      <div class="site-search">
        <input type="text" id="site-search-input" placeholder="Search the archive…" autocomplete="off">
        <div id="site-search-results" class="site-search-results"></div>
      </div>
      <span id="auth-status" style="font-family: var(--font-mono); font-size: 0.72rem;"></span>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="crumb"><a href="index.html">Archive</a><span class="sep">/</span><a id="crumb-category" href="#"></a><span class="sep">/</span><span id="crumb-name"></span></div>

  <div class="sheet">
    <div id="faction-banner"></div>

    <div class="sheet-header">
      <p class="sheet-eyebrow" id="sheet-eyebrow"></p>
      <h1 id="sheet-title"></h1>
      <p class="subtitle" id="sheet-subtitle"></p>
      <div id="sheet-tags"></div>
    </div>

    <div class="sheet-body" id="sheet-body"></div>

    <div class="sheet-footer" id="sheet-footer"></div>

    <div id="dungeon-map-zone" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-line-soft);"></div>

    <div id="entry-export-zone" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-line-soft); display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
      <button id="export-entry-btn" style="background: var(--bg-panel-raised); color: var(--ink); border: 1px solid var(--border-line); padding: 8px 16px; font-family: var(--font-display); text-transform: uppercase; font-size: 0.78rem; cursor: pointer;">Download PDF</button>
      <label style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-dim); display: flex; align-items: center; gap: 6px;">
        <input type="checkbox" id="export-include-images" checked> Include image
      </label>
      <span id="export-entry-status" style="font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-faint);"></span>
    </div>

    <div id="entry-danger-zone" style="margin-top: 16px; padding-top: 20px; border-top: 1px solid var(--border-line-soft);">
      <button id="delete-entry-btn" style="background: transparent; color: var(--danger, #c0392b); border: 1px solid var(--danger, #c0392b); padding: 8px 16px; font-family: var(--font-display); text-transform: uppercase; font-size: 0.78rem; cursor: pointer;">Delete This Entry</button>
      <div id="delete-entry-status" style="margin-top: 10px; font-family: var(--font-mono); font-size: 0.78rem;"></div>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap"><span id="site-footer-text">CHRONICLED</span><span class="app-version">v0.7 · beta</span></div>
</footer>

<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_category_config_cache');
    if (!cached) return;
    var categoryConfig = JSON.parse(cached);
    var site = categoryConfig._site || {};
    if (site.title) {
      var titleEl = document.getElementById('site-title-text');
      if (titleEl) titleEl.textContent = site.title;
      document.title = document.title.indexOf(' \u2014 ') !== -1
        ? document.title.replace(/ \u2014 .+$/, ' \u2014 ' + site.title)
        : site.title;
    }
    if (site.tagline) {
      var taglineEl = document.getElementById('hero-tagline');
      if (taglineEl) taglineEl.textContent = site.tagline;
    }
    if (site.footer) {
      var footerEl = document.getElementById('site-footer-text');
      if (footerEl) footerEl.textContent = site.footer;
    }
    Object.keys(categoryConfig).forEach(function(key) {
      if (key === '_site') return;
      var cfg = categoryConfig[key];
      var navLink = document.getElementById('nav-' + key);
      if (navLink) {
        if (cfg.enabled === false) navLink.style.display = 'none';
        else if (cfg.label) navLink.textContent = cfg.label;
      }
      var card = document.getElementById('card-' + key);
      if (card) {
        if (cfg.enabled === false) {
          card.style.display = 'none';
        } else if (cfg.label) {
          var h2 = card.querySelector('h2');
          if (h2) h2.textContent = cfg.label;
        }
      }
      if (cfg.blurb) {
        var cardDesc = document.getElementById('card-desc-' + key);
        if (cardDesc) cardDesc.textContent = cfg.blurb;
      }
      if (document.body.dataset.category === key) {
        if (cfg.label) {
          var pageTitle = document.getElementById('page-title');
          var crumbLabel = document.getElementById('crumb-label');
          if (pageTitle) pageTitle.textContent = cfg.label;
          if (crumbLabel) crumbLabel.textContent = cfg.label;
          document.title = document.title.replace(/^[^\u2014]+/, cfg.label + ' ');
        }
        if (cfg.blurb) {
          var pageBlurb = document.getElementById('page-blurb');
          if (pageBlurb) pageBlurb.textContent = cfg.blurb;
        }
      }
    });
  } catch (e) { /* no cache yet, or malformed -- async apply will fix it */ }
})();
</script>
<script src="/config.js"></script>
<script src="/version.js"></script>
<script>
  if (window.APP_VERSION) {
    document.querySelectorAll('.app-version').forEach(function(el) {
      el.textContent = window.APP_VERSION + ' \u00b7 beta';
    });
  }
</script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/auth.js?v=v0.16"></script>
<script src="js/render.js?v=v0.16"></script>
<script src="js/portraitActions.js?v=v0.16"></script>
<script src="js/worldArtActions.js?v=v0.16"></script>
<script>
  requireAuth().then((session) => {
    if (!session) return;
    renderAuthStatus();
    applyCategoryConfig();
    applySiteTheme();
    applyAiEnabledGating();
    loadAndRenderDossier();
  });
</script>

</body>
</html>
