<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map — The Archive</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  .map-wrap { position: relative; width: 100%; max-width: 1100px; margin: 0 auto; }
  /* Fixed pixel height (not aspect-ratio-locked like the old SVG) --
     Leaflet needs a concrete container size to compute its own tiling/
     pan bounds against; percentage/auto height doesn't work here the
     way it did for a plain <svg viewBox>. */
  #map-canvas { width: 100%; height: 640px; border: 1px solid var(--border-line); background: var(--bg-panel); }
  #map-status { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-faint); padding: 40px 0; text-align: center; }
  .map-legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 16px 0 0; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-dim); }
  .map-legend-item { display: flex; align-items: center; gap: 6px; }
  .map-legend-swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  /* Leaflet's default popup/control chrome is light-themed and doesn't
     know about this site's CSS variables -- overridden here rather than
     left to clash against the dark theme everywhere else. */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--bg-panel-raised); color: var(--ink); border: 1px solid var(--border-line); border-radius: 0; box-shadow: none; }
  .leaflet-popup-content { margin: 14px 16px; font-family: var(--font-body); }
  .map-popup-title { font-family: var(--font-display); text-transform: uppercase; font-size: 0.95rem; margin: 0 0 6px; color: var(--ink); }
  .map-popup-faction { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); margin: 0 0 10px; }
  .map-popup-hint { font-family: var(--font-mono); font-size: 0.65rem; color: var(--neon-cyan); margin-top: 8px; }
  .map-popup-img { width: 100%; max-width: 220px; display: block; margin-top: 8px; border: 1px solid var(--border-line); }
  .leaflet-container { background: var(--bg-panel); font-family: var(--font-body); }
  .leaflet-control-zoom a { background: var(--bg-panel-raised); color: var(--ink); border-color: var(--border-line); }
  .leaflet-control-zoom a:hover { background: var(--bg-void); color: var(--neon-cyan); }
</style>
<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_theme_cache');
    if (!cached) return;
    var t = JSON.parse(cached);
    var hex = /^#[0-9a-fA-F]{6}$/;
    var overrides = [];
    if (hex.test(t.backgroundColor)) overrides.push('--bg-void: ' + t.backgroundColor + ';');
    if (hex.test(t.panelColor)) overrides.push('--bg-panel: ' + t.panelColor + '; --bg-panel-raised: ' + t.panelColor + ';');
    if (hex.test(t.inkColor)) overrides.push('--ink: ' + t.inkColor + ';');
    if (hex.test(t.primaryColor)) overrides.push('--neon-primary: ' + t.primaryColor + ';');
    if (hex.test(t.secondaryColor)) overrides.push('--neon-cyan: ' + t.secondaryColor + ';');
    if (t.fontDisplay) {
      overrides.push("--font-display: '" + t.fontDisplay + "', sans-serif;");
      var l1 = document.createElement('link');
      l1.rel = 'stylesheet';
      l1.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.fontDisplay).replace(/%20/g, '+') + ':wght@400;600;700&display=swap';
      document.head.appendChild(l1);
    }
    if (t.fontBody) {
      overrides.push("--font-body: '" + t.fontBody + "', sans-serif;");
      var l2 = document.createElement('link');
      l2.rel = 'stylesheet';
      l2.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.fontBody).replace(/%20/g, '+') + ':wght@400;500;600&display=swap';
      document.head.appendChild(l2);
    }
    var styleTag = document.createElement('style');
    styleTag.id = 'world-theme-cached';
    styleTag.textContent = ':root { ' + overrides.join(' ') + ' }';
    document.head.appendChild(styleTag);
  } catch (e) { /* no cache yet, or malformed -- fall back to default theme, async apply will fix it */ }
})();
</script>

</head>
<body data-category="map">

<header class="site-header">
  <div class="wrap">
    <div class="site-title"><a href="index.html"><span id="site-title-text">The <span class="accent">Archive</span></span></a></div>
    <nav class="site-nav">
      <a href="factions/index.html" id="nav-factions">Factions</a>
      <a href="npcs/index.html" id="nav-npcs">NPCs</a>
      <a href="enemies/index.html" id="nav-enemies">Bestiary</a>
      <a href="classes/index.html" id="nav-classes">Classes</a>
      <a href="items/index.html" id="nav-items">Items</a>
      <a href="logs/index.html" id="nav-logs">Logs</a>
      <a href="survivors/index.html" id="nav-survivors">Survivors</a>
      <a href="locations/index.html" id="nav-locations">Locations</a>
      <a href="campaigns/index.html" id="nav-quests">Quests</a>
      <a href="campaign-arcs/index.html" id="nav-campaign-arcs">Campaigns</a>
      <a href="map.html" id="nav-map">Map</a>
      <a href="world-info.html" id="nav-world-info">World Info</a>
      <a href="settings.html" id="nav-settings">Settings</a>
      <div class="site-search">
        <input type="text" id="site-search-input" placeholder="Search the archive…" autocomplete="off">
        <div id="site-search-results" class="site-search-results"></div>
      </div>
      <span id="auth-status" style="font-family: var(--font-mono); font-size: 0.72rem;"></span>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="crumb"><a href="index.html">Archive</a><span class="sep">/</span><span id="crumb-label">Map</span></div>
  <h1 style="font-family: var(--font-display); text-transform: uppercase; margin: 20px 0 8px;" id="page-title">Map</h1>
  <p style="color: var(--ink-dim); max-width: 640px; margin: 0 0 24px;" id="page-blurb">Every archived location, laid out by territory. Scroll to zoom, drag to pan, click a pin for details.</p>

  <div class="map-wrap">
    <div id="map-status">Loading…</div>
    <div id="map-canvas" style="display:none;"></div>
    <div class="map-legend" id="map-legend"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap">
    <span id="site-footer-text">CHRONICLED</span><span class="app-version">v0.7 · beta</span>
  </div>
</footer>

<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_category_config_cache');
    if (!cached) return;
    var categoryConfig = JSON.parse(cached);
    var site = categoryConfig._site || {};
    if (site.title) {
      var titleEl = document.getElementById('site-title-text');
      if (titleEl) titleEl.textContent = site.title;
      document.title = document.title.indexOf(' \u2014 ') !== -1
        ? document.title.replace(/ \u2014 .+$/, ' \u2014 ' + site.title)
        : site.title;
    }
    if (site.footer) {
      var footerEl = document.getElementById('site-footer-text');
      if (footerEl) footerEl.textContent = site.footer;
    }
    Object.keys(categoryConfig).forEach(function(key) {
      if (key === '_site') return;
      var cfg = categoryConfig[key];
      var navLink = document.getElementById('nav-' + key);
      if (navLink) {
        if (cfg.enabled === false) navLink.style.display = 'none';
        else if (cfg.label) navLink.textContent = cfg.label;
      }
    });
  } catch (e) { /* no cache yet, or malformed -- async apply will fix it */ }
})();
</script>
<script src="/config.js"></script>
<script src="/version.js"></script>
<script>
  if (window.APP_VERSION) {
    document.querySelectorAll('.app-version').forEach(function(el) {
      el.textContent = window.APP_VERSION + ' \u00b7 beta';
    });
  }
</script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/auth.js"></script>
<script src="js/render.js"></script>
<script src="js/mapLayout.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  // Faction accent colors reuse the same lookup NPC/Bestiary pages use
  // (see archive/js/render.js's getFactionLookup + facColorVar) so a
  // location's pin matches its dossier's tag color exactly.

  // Pulls the portrait <img> src out of a location's own already-
  // generated bodyHtml (see lib/locationTemplate.js's buildLocationBodyHtml
  // -- every Location gets ENVIRONMENT-framed art the same way NPCs get
  // portraits, via prompts/artPromptPrompt.js). Shown inside each pin's
  // popup rather than composited into the map canvas itself -- after
  // several attempts this session at blending independently-generated
  // art into one shared scene (biome tiles, faction-territory tiles,
  // in-canvas vignettes), the pin+popup pattern sidesteps the whole
  // problem: nothing needs to visually merge with anything else, so
  // there's no blending/masking/registration bug left to have. See
  // multi_tenant_pivot_scope.md's map-fix addenda for the full history.
  function extractPortraitUrl(bodyHtml) {
    if (!bodyHtml) return null;
    const holder = document.createElement("div");
    holder.innerHTML = bodyHtml;
    const img = holder.querySelector(".portrait-img");
    return img ? img.getAttribute("src") : null;
  }

  const CANVAS_WIDTH = 1000;
  const CANVAS_HEIGHT = 600;

  async function loadAndRenderMap() {
    const statusEl = document.getElementById("map-status");
    const canvasEl = document.getElementById("map-canvas");
    const legendEl = document.getElementById("map-legend");
    try {
      // Step 1: does a shared base backdrop already exist? Only auto-
      // generate if not -- this must never fire more than once per world
      // in the normal case (see routes/map.js's own idempotency check as
      // a second line of defense against a double-click/double-load
      // race). The art itself is still deliberately atmosphere-only (see
      // prompts/mapBackdropPrompt.js) -- it's never told where any
      // faction's territory should go. What connects the two is a
      // separate vision pass run right after generation (see
      // routes/map.js's detectFactionAnchors): Claude looks at the
      // finished image and finds real structures/regions that plausibly
      // match each faction's own territory description, returned here as
      // `anchors`. A faction with a genuine visual match gets pinned
      // there; anything else falls back to the existing circular layout
      // (see anchorOverrides below).
      let backdropUrl = null;
      let normalizedAnchors = {};
      const statusRes = await authFetch("/api/map/backdrop");
      const statusData = await statusRes.json();
      if (statusData.exists) {
        backdropUrl = statusData.url;
        normalizedAnchors = statusData.anchors || {};
      } else {
        statusEl.textContent = "Generating your world's map backdrop — this only happens once, give it a moment…";
        showGenerationOverlay(["Painting the backdrop…", "Studying the layout…", "This only happens once…", "Almost there…"]);
        const genRes = await authFetch("/api/map/generate-backdrop", { method: "POST" });
        const genData = await genRes.json();
        hideGenerationOverlay();
        if (!genRes.ok) throw new Error(genData.error || "Backdrop generation failed");
        backdropUrl = genData.url;
        normalizedAnchors = genData.anchors || {};
      }

      // Step 2: locations + faction order/lookup
      const [locRes, facRes, factionLookup] = await Promise.all([
        authFetch("/api/entries/locations"),
        authFetch("/api/entries/factions"),
        getFactionLookup()
      ]);
      const locData = await locRes.json();
      const facData = await facRes.json();
      if (!locRes.ok) throw new Error(locData.error || "Failed to load locations");
      const locations = locData.entries || [];
      const factionOrder = (facData.entries || []).map((f) => f.faction || f.id);

      if (locations.length === 0) {
        statusEl.textContent = "No locations archived yet — generate one from the Locations tab and it'll show up here.";
        return;
      }

      // Same faction-clustered layout math as before -- pan/zoom is what
      // actually fixes crowding (room to spread out, not fighting for a
      // fixed pixel budget), not a change to the underlying coordinates.
      // Vision-detected anchors come back normalized (0-1, see
      // prompts/mapAnchorPrompt.js) -- scaled up to canvas-space pixel
      // coordinates here, once, before handing them to the shared layout
      // function (which expects the same coordinate space the circular
      // default already works in).
      const anchorOverrides = {};
      Object.entries(normalizedAnchors).forEach(([factionKey, coords]) => {
        if (!coords) return;
        anchorOverrides[factionKey] = { x: coords.x * CANVAS_WIDTH, y: coords.y * CANVAS_HEIGHT };
      });

      // Diagnostic logging -- prints exactly what came back from the
      // vision detection vs. what faction keys this world's locations
      // actually use, so a real id mismatch (see mapLayout.js's
      // normalizeFactionKey fallback + console.warn) is visible directly
      // in the browser console without needing to inspect Supabase.
      const locationFactionKeys = [...new Set(locations.map((l) => (l.faction && l.faction !== "unaligned" ? l.faction : "unaligned")))];
      console.log("Map: vision-detected anchors (normalized 0-1):", normalizedAnchors);
      console.log("Map: faction keys actually used by this world's locations:", locationFactionKeys);

      const nodes = computeMapLayout(locations, factionOrder, anchorOverrides);
      const bodyHtmlById = {};
      locations.forEach((loc) => { bodyHtmlById[loc.id] = loc.bodyHtml; });

      // Cache-busting query param -- Supabase's public URL for the
      // backdrop is the same deterministic path every time
      // (.../backdrop.png), so after a regenerate with the same
      // filename, browsers (and possibly CDN edge caching in front of
      // Supabase Storage) will keep serving the OLD cached bytes at that
      // exact URL unless something makes it look like a different
      // request. This is almost certainly why a freshly-regenerated
      // backdrop looked identical to the deleted one -- the generation
      // itself was genuinely new, the browser just never re-fetched it.
      const bustedBackdropUrl = backdropUrl ? `${backdropUrl}?v=${Date.now()}` : null;

      // Step 3: initialize the Leaflet map. L.CRS.Simple is Leaflet's
      // flat, non-geographic coordinate mode -- built for exactly this
      // (game maps, floor plans, fictional worlds), not real-world lat/
      // lng projections. Bounds/coordinates below are [y, x] pairs (top-
      // left origin, y increasing downward) to match a normal image's
      // own coordinate system -- unintuitive if you're used to [x, y],
      // but standard for this Leaflet mode.
      statusEl.style.display = "none";
      canvasEl.style.display = "block";
      const bounds = [[0, 0], [CANVAS_HEIGHT, CANVAS_WIDTH]];
      const map = L.map("map-canvas", {
        crs: L.CRS.Simple,
        minZoom: -1,
        maxZoom: 3,
        zoomSnap: 0.25
      });
      if (bustedBackdropUrl) {
        L.imageOverlay(bustedBackdropUrl, bounds).addTo(map);
      }
      map.fitBounds(bounds);
      map.setMaxBounds([[-CANVAS_HEIGHT * 0.4, -CANVAS_WIDTH * 0.4], [CANVAS_HEIGHT * 1.4, CANVAS_WIDTH * 1.4]]);

      // Step 4: one circle marker per location, faction-colored, with a
      // popup showing that location's own name/faction/art -- clicking
      // opens the popup; the dossier link inside it is the real
      // navigation target (kept as a separate step rather than
      // navigating straight from a marker click, since a map you're
      // actively panning/zooming shouldn't eat a click as "leave the
      // page" by accident).
      // Leaflet's SVG renderer applies marker stroke/fill via
      // setAttribute(), which does NOT reliably resolve CSS custom
      // properties the way an inline style="" does -- passing the raw
      // string "var(--bg-void)" risks silently not rendering in some
      // browsers. Reading the actual computed value once, up front,
      // keeps this both correct and still theme-aware (per-world color
      // overrides still apply, since this reads whatever --bg-void
      // currently resolves to on the page).
      const markerStrokeColor = getComputedStyle(document.documentElement).getPropertyValue("--bg-void").trim() || "#0a0b0d";

      // Same setAttribute-vs-CSS-variable issue as markerStrokeColor
      // above, but for fillColor -- facColorVar() returns either a real
      // hex string (the common case, once a faction has an accent color
      // set) or the literal fallback string "var(--neon-cyan)" for
      // factions without one. Resolves that fallback the same way.
      function resolveColor(value) {
        const match = /^var\((--[a-zA-Z0-9-]+)\)$/.exec(value || "");
        if (!match) return value;
        return getComputedStyle(document.documentElement).getPropertyValue(match[1]).trim() || "#29f0d1";
      }

      nodes.forEach((n) => {
        const color = resolveColor(facColorVar(n.faction, factionLookup));
        const facName = n.faction && n.faction !== "unaligned"
          ? ((factionLookup[n.faction] && factionLookup[n.faction].name) || n.faction)
          : "Unaligned";
        const portraitUrl = extractPortraitUrl(bodyHtmlById[n.id]);
        const popupHtml = `
          <div class="map-popup-title">${n.name}</div>
          <div class="map-popup-faction">${facName}</div>
          ${portraitUrl ? `<img class="map-popup-img" src="${portraitUrl}" alt="${n.name}">` : ""}
          <div class="map-popup-hint">Click to view dossier</div>
        `;
        // Y-AXIS FLIP: Leaflet's CRS.Simple treats [0,0] as the
        // BOTTOM-left of the map, with the first coordinate ("lat")
        // increasing UPWARD -- confirmed directly against Leaflet's own
        // documented image-overlay pattern, not assumed. Every layout
        // calculation in this app (computeMapLayout's jitter/clustering,
        // the vision-detected anchors, CANVAS_HEIGHT itself) uses normal
        // top-down image convention instead, where y=0 is the TOP and y
        // increases downward -- the same convention the vision prompt
        // told Claude to use, and the only sane one for describing "where
        // in the image" something is. Passing n.y straight through as
        // Leaflet's lat mirrored every pin vertically: a location meant
        // to sit near the top of the image (small y) rendered near the
        // bottom instead, and vice versa. This is the ONE place these two
        // conventions meet, so it's the one place that needs to flip.
        const marker = L.circleMarker([CANVAS_HEIGHT - n.y, n.x], {
          radius: 8,
          color: markerStrokeColor,
          weight: 2,
          fillColor: color,
          fillOpacity: 1
        }).addTo(map);

        // Hover shows the info card; click navigates. closeButton:false
        // since hover (not an explicit user action) opens it -- a close
        // button implies something the user chose to open. autoPan:false
        // stops the map recentering itself just because the mouse
        // happened to pass near the edge of a pin's popup.
        marker.bindPopup(popupHtml, { closeButton: false, autoPan: false });
        marker.on("mouseover", () => marker.openPopup());
        marker.on("mouseout", () => marker.closePopup());
        marker.on("click", () => {
          window.location.href = `dossier.html?category=locations&id=${n.id}`;
        });
      });

      // Legend: one swatch per faction actually represented on the map.
      const seen = new Set();
      const legendItems = [];
      nodes.forEach((n) => {
        const key = n.faction || "unaligned";
        if (seen.has(key)) return;
        seen.add(key);
        const name = key === "unaligned" ? "Unaligned" : ((factionLookup[key] && factionLookup[key].name) || key);
        const color = facColorVar(n.faction, factionLookup);
        legendItems.push(`<span class="map-legend-item"><span class="map-legend-swatch" style="background:${color};"></span>${name}</span>`);
      });
      legendEl.innerHTML = legendItems.join("");
    } catch (err) {
      console.error("Failed to load map:", err);
      statusEl.textContent = "Could not load the map: " + err.message;
      statusEl.style.display = "block";
    }
  }

  requireAuth().then((session) => {
    if (!session) return;
    renderAuthStatus();
    applyCategoryConfig();
    applySiteTheme();
    loadAndRenderMap();
  });
</script>
</body>
</html>
