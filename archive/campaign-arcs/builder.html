<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign — The Archive</title>
<link rel="stylesheet" href="../css/style.css">
<script>
(function() {
  try {
    var cached = localStorage.getItem('worldforge_theme_cache');
    if (!cached) return;
    var t = JSON.parse(cached);
    var hex = /^#[0-9a-fA-F]{6}$/;
    var overrides = [];
    if (hex.test(t.backgroundColor)) overrides.push('--bg-void: ' + t.backgroundColor + ';');
    if (hex.test(t.panelColor)) overrides.push('--bg-panel: ' + t.panelColor + '; --bg-panel-raised: ' + t.panelColor + ';');
    if (hex.test(t.inkColor)) overrides.push('--ink: ' + t.inkColor + ';');
    if (hex.test(t.primaryColor)) overrides.push('--neon-primary: ' + t.primaryColor + ';');
    if (hex.test(t.secondaryColor)) overrides.push('--neon-cyan: ' + t.secondaryColor + ';');
    if (t.fontDisplay) {
      overrides.push("--font-display: '" + t.fontDisplay + "', sans-serif;");
      var l1 = document.createElement('link');
      l1.rel = 'stylesheet';
      l1.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.fontDisplay).replace(/%20/g, '+') + ':wght@400;600;700&display=swap';
      document.head.appendChild(l1);
    }
    if (t.fontBody) {
      overrides.push("--font-body: '" + t.fontBody + "', sans-serif;");
      var l2 = document.createElement('link');
      l2.rel = 'stylesheet';
      l2.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(t.fontBody).replace(/%20/g, '+') + ':wght@400;500;600&display=swap';
      document.head.appendChild(l2);
    }
    var styleTag = document.createElement('style');
    styleTag.id = 'world-theme-cached';
    styleTag.textContent = ':root { ' + overrides.join(' ') + ' }';
    document.head.appendChild(styleTag);
  } catch (e) { /* no cache yet, or malformed -- async apply will fix it */ }
})();
</script>
</head>
<body data-category="campaign-arcs">

<header class="site-header">
  <div class="wrap">
    <div class="site-title"><a href="../index.html"><span id="site-title-text">The <span class="accent">Archive</span></span></a></div>
    <nav class="site-nav">
      <a href="../factions/index.html" id="nav-factions">Factions</a>
      <a href="../npcs/index.html" id="nav-npcs">NPCs</a>
      <a href="../enemies/index.html" id="nav-enemies">Bestiary</a>
      <a href="../classes/index.html" id="nav-classes">Classes</a>
      <a href="../items/index.html" id="nav-items">Items</a>
      <a href="../logs/index.html" id="nav-logs">Logs</a>
      <a href="../survivors/index.html" id="nav-survivors">PCs</a>
      <a href="../locations/index.html" id="nav-locations">Locations</a>
      <a href="../campaigns/index.html" id="nav-quests">Quests</a>
      <a href="../campaign-arcs/index.html" id="nav-campaign-arcs">Campaigns</a>
      <a href="../map.html" id="nav-map">Map</a>
      <a href="../world-info.html" id="nav-world-info">World Info</a>
      <a href="../settings.html" id="nav-settings">Settings</a>
      <div class="site-search">
        <input type="text" id="site-search-input" placeholder="Search the archive…" autocomplete="off">
        <div id="site-search-results" class="site-search-results"></div>
      </div>
      <span id="auth-status" style="font-family: var(--font-mono); font-size: 0.72rem;"></span>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="crumb"><a href="../index.html">Archive</a><span class="sep">/</span><a href="index.html">Campaigns</a><span class="sep">/</span><span id="crumb-name">New</span></div>

  <div class="sheet" style="margin: 20px 0;">
    <div id="ca-view-mode"></div>

    <div id="ca-edit-mode">
    <div class="sheet-header">
      <p class="sheet-eyebrow">Campaign</p>
      <input id="ca-name" type="text" placeholder="Name this Campaign…" style="width:100%; background: transparent; border: none; border-bottom: 1px solid var(--border-line); color: var(--ink); font-family: var(--font-display); text-transform: uppercase; font-size: 1.8rem; padding: 4px 0; margin: 6px 0 12px;">
      <textarea id="ca-summary" placeholder="Short DM-facing summary of the overall arc…" rows="2" style="width:100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); font-family: var(--font-body); padding: 8px 10px; resize: vertical;"></textarea>
    </div>

    <div class="sheet-body">
      <!-- ai-action: hidden entirely for AI-off accounts (see
           css/style.css's body.ai-disabled rule and this page's
           applyAiEnabledGating() call below) -- a Campaign becomes
           fully manual (Stages: add an existing Quest only) with AI
           turned off. -->
      <div class="ai-action">
        <h2>Plan with AI</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px;">
          <div style="flex: 1; min-width: 240px;">
            <label for="ca-concept" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">CONCEPT (optional)</label>
            <input id="ca-concept" type="text" placeholder="leave blank to let it invent one" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;">
          </div>
          <div>
            <label for="ca-stage-count" style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">STAGES</label>
            <select id="ca-stage-count" style="background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;">
              <option value="">Let it choose</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <button type="button" id="ca-generate-btn" class="bm-btn">Plan Campaign (1 generation)</button>
        </div>
        <p id="ca-generate-status" class="bm-status"></p>
      </div>

      <h2 style="margin-top: 28px;">Stages</h2>
      <p style="color: var(--ink-dim); font-size: 0.85rem; margin: 0 0 12px;">The Quests that make up this Campaign, in order.</p>
      <div id="ca-stages-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;"></div>

      <div style="border: 1px dashed var(--border-line); padding: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;">
        <div style="flex: 1; min-width: 240px;">
          <label style="display:block; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint); margin-bottom: 4px;">ADD AN EXISTING QUEST</label>
          <select id="ca-add-quest" style="width: 100%; background: var(--bg-panel-raised); border: 1px solid var(--border-line); color: var(--ink); padding: 8px 10px;"></select>
        </div>
        <button type="button" id="ca-add-btn" class="bm-btn">Add to Campaign</button>
        <a href="../campaigns/builder.html" class="bm-btn bm-btn-secondary" style="text-decoration:none; display:inline-block;">Create a new Quest →</a>
      </div>
    </div>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-line-soft); display: flex; align-items: center; gap: 14px; flex-wrap: wrap;">
      <button type="button" id="ca-save-btn" class="bm-btn" style="background: var(--neon-primary); color: var(--bg-void); border: none; font-weight: 600;">Save Campaign</button>
      <button type="button" id="ca-cancel-edit-btn" class="bm-btn bm-btn-secondary" style="display:none;">Cancel</button>
      <span id="ca-save-status" class="bm-status"></span>
    </div>
    </div>

    <div id="ca-danger-zone" style="display:none; margin-top: 16px; padding-top: 20px; border-top: 1px solid var(--border-line-soft);">
      <button type="button" id="ca-delete-btn" class="bm-btn bm-btn-danger">Delete This Campaign</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap"><span id="site-footer-text">CHRONICLED</span><span class="app-version">v0.7 · beta</span></div>
</footer>

<script src="/config.js"></script>
<script src="/version.js"></script>
<script>
  if (window.APP_VERSION) {
    document.querySelectorAll('.app-version').forEach(function(el) {
      el.textContent = window.APP_VERSION + ' \u00b7 beta';
    });
  }
</script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/js/auth.js?v=v0.16"></script>
<script src="../js/render.js?v=v0.16"></script>
<script src="../js/campaignArc.js?v=v0.16"></script>
<script>
  requireAuth().then((session) => {
    if (!session) return;
    renderAuthStatus();
    applyCategoryConfig();
    applySiteTheme();
    applyAiEnabledGating(); // hides the whole "Plan with AI" section (.ai-action) for AI-off accounts -- Stages stays fully manual
    initCampaignArcBuilder();
  });
</script>

</body>
</html>
